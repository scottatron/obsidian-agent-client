[tasks.local-install]
description = "Build agent-client and install into an Obsidian vault plugin dir (set OBSIDIAN_VAULT_DIR to override)"
run = """
set -e

VAULT_DIR="${OBSIDIAN_VAULT_DIR:-/Users/sarthur/src/github.com/scottatron/squad}"
VAULT_NAME=$(basename "$VAULT_DIR")
PLUGIN_DIR="$VAULT_DIR/.obsidian/plugins/agent-client"

if [ ! -d "$VAULT_DIR/.obsidian" ]; then
  echo "Vault does not look valid (missing .obsidian): $VAULT_DIR" >&2
  echo "Set OBSIDIAN_VAULT_DIR to a valid vault root directory." >&2
  exit 1
fi

mkdir -p "$PLUGIN_DIR"
cp dist/main.js dist/manifest.json dist/styles.css "$PLUGIN_DIR/"
obsidian vault="$VAULT_NAME" plugin:enable id=agent-client || true
obsidian vault="$VAULT_NAME" plugin:reload id=agent-client || true

echo "Installed to: $PLUGIN_DIR"
"""
# Watch built artifacts so local-install only runs after the bundle sync completes.
sources = ["dist/main.js", "dist/manifest.json", "dist/styles.css"]

[tasks.install-to-all-local-vaults]
description = "Install agent-client to all local vaults"
run = """
set -e

for vault_name in $(obsidian vaults); do
  echo "Installing to vault: $vault_name"
  vault_path=$(obsidian vault="$vault_name" vault info=path)
  VAULT_DIR="$vault_path" mise run local-install
done
"""

[env]
OBSIDIAN_VAULT_DIR = "/Users/sarthur/src/github.com/Wesfarmers-Digital/platform-support"
